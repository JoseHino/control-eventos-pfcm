<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Control de Eventos · PFCM</title>
<style>
:root{
  color-scheme: light;
  --brand:#1044CD; --accent:#1ADEB1;
  --surface-0:#f4f5f7; --surface-1:#ffffff; --surface-2:#fafbfc;
  --line:#e2e5ea; --line-strong:#cbd1da;
  --text-1:#1b1d21; --text-2:#5b6270; --text-3:#8a919e;
  --s1:#1044CD; --s2:#eb6834; --s3:#0e9e78; --s4:#eda100; --s5:#e87ba4; --s6:#4a3aa7;
  --good:#0e7a4f; --warn:#a86a00; --serious:#c2410c; --crit:#b91c1c;
  --good-bg:#e7f5ee; --warn-bg:#fdf3e0; --serious-bg:#fdeee5; --crit-bg:#fdeaea; --info-bg:#e8effc;
  --seq-1:#cde2fb; --seq-2:#9ec5f4; --seq-3:#6da7ec; --seq-4:#3987e5; --seq-5:#256abf; --seq-6:#184f95;
  --shadow:0 1px 2px rgba(16,24,40,.06), 0 1px 3px rgba(16,24,40,.10);
  --radius:10px;
}
html[data-theme="dark"]{
  color-scheme: dark;
  --brand:#4d84ea; --accent:#1ADEB1;
  --surface-0:#111213; --surface-1:#1a1a19; --surface-2:#212223;
  --line:#2e3033; --line-strong:#41444a;
  --text-1:#f2f3f5; --text-2:#b4b9c2; --text-3:#868c96;
  --s1:#4d84ea; --s2:#d95926; --s3:#15a87c; --s4:#c98500; --s5:#d55181; --s6:#9085e9;
  --good:#4ade80; --warn:#fbbf24; --serious:#fb923c; --crit:#f87171;
  --good-bg:#152a20; --warn-bg:#2b2312; --serious-bg:#2e1e14; --crit-bg:#2e1717; --info-bg:#16233f;
  --seq-1:#123055; --seq-2:#184f95; --seq-3:#256abf; --seq-4:#3987e5; --seq-5:#6da7ec; --seq-6:#9ec5f4;
  --shadow:0 1px 2px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
body{margin:0;background:var(--surface-0);color:var(--text-1);
  font:14px/1.5 "Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;font-weight:650;letter-spacing:-.01em}
button{font:inherit;color:inherit}
a{color:var(--brand)}

/* ---------- Cabecera ---------- */
.top{background:#0b2a8a;color:#fff;padding:14px 22px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
html[data-theme="dark"] .top{background:#101a33}
.top .mark{width:30px;height:30px;border-radius:7px;background:var(--accent);flex:0 0 auto;
  display:grid;place-items:center;color:#08205e;font-weight:800;font-size:13px;letter-spacing:-.5px}
.top h1{font-size:16.5px;line-height:1.2}
.top .sub{font-size:12px;color:#b9c8ef;margin-top:2px}
.top .spacer{flex:1}
.top .tbtn{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);color:#fff;
  border-radius:8px;padding:7px 12px;cursor:pointer;font-size:13px;display:inline-flex;align-items:center;gap:7px}
.top .tbtn:hover{background:rgba(255,255,255,.22)}
.top .tbtn.primary{background:var(--accent);color:#08205e;border-color:transparent;font-weight:600}
.top .tbtn.primary:hover{background:#3ee9c1}
.stamp{font-size:11.5px;color:#b9c8ef;text-align:right;line-height:1.35}
.stamp b{color:#fff;font-weight:600}

/* ---------- Pestanas ---------- */
.tabs{display:flex;gap:2px;background:var(--surface-1);border-bottom:1px solid var(--line);padding:0 22px;
  position:sticky;top:0;z-index:30;overflow-x:auto}
.tab{background:none;border:none;padding:12px 15px;cursor:pointer;color:var(--text-2);font-size:13.5px;
  border-bottom:2.5px solid transparent;white-space:nowrap;display:flex;align-items:center;gap:7px}
.tab:hover{color:var(--text-1)}
.tab[aria-selected="true"]{color:var(--brand);border-bottom-color:var(--brand);font-weight:600}
.badge{background:var(--crit-bg);color:var(--crit);border-radius:99px;padding:1px 7px;font-size:11px;font-weight:700}
.badge.mut{background:var(--surface-0);color:var(--text-3)}

/* ---------- Filtros ---------- */
.filters{background:var(--surface-1);border-bottom:1px solid var(--line);padding:11px 22px;
  display:flex;gap:9px;align-items:flex-end;flex-wrap:wrap;position:sticky;top:44px;z-index:29}
.fg{display:flex;flex-direction:column;gap:4px}
.fg label{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-3);font-weight:650}
.fg select,.fg input{background:var(--surface-2);border:1px solid var(--line-strong);border-radius:7px;
  padding:6px 9px;font:inherit;font-size:13px;color:var(--text-1);min-width:118px;max-width:220px}
.fg input{min-width:200px}
.fg select:focus,.fg input:focus{outline:2px solid var(--brand);outline-offset:-1px;border-color:var(--brand)}
.chk{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--text-2);padding-bottom:7px;cursor:pointer}
.chk input{accent-color:var(--brand);width:15px;height:15px;margin:0}
.fbtn{background:var(--surface-2);border:1px solid var(--line-strong);border-radius:7px;padding:6px 11px;
  cursor:pointer;font-size:13px;color:var(--text-2)}
.fbtn:hover{border-color:var(--brand);color:var(--brand)}
.fcount{font-size:12.5px;color:var(--text-2);padding-bottom:7px;margin-left:auto}
.fcount b{color:var(--text-1);font-weight:650}

/* ---------- Paneles ---------- */
main{padding:20px 22px 60px;max-width:1560px;margin:0 auto}
.panel[hidden]{display:none}
.grid{display:grid;gap:14px}
.k6{grid-template-columns:repeat(auto-fit,minmax(172px,1fr))}
.c2{grid-template-columns:repeat(auto-fit,minmax(430px,1fr))}
.card{background:var(--surface-1);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:15px 17px}
.card > h3{font-size:13.5px;margin-bottom:2px}
.card > .hint{font-size:11.5px;color:var(--text-3);margin-bottom:12px}

/* KPI */
.kpi .lab{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-3);font-weight:650}
.kpi .val{font-size:29px;font-weight:680;letter-spacing:-.025em;margin:5px 0 2px;font-variant-numeric:tabular-nums}
.kpi .foot{font-size:12px;color:var(--text-2);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.delta{font-weight:650;font-variant-numeric:tabular-nums;border-radius:5px;padding:1px 6px;font-size:11.5px}
.delta.up{color:var(--good);background:var(--good-bg)}
.delta.down{color:var(--crit);background:var(--crit-bg)}
.delta.flat{color:var(--text-2);background:var(--surface-0)}

/* Graficas */
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:12px;color:var(--text-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;flex:0 0 auto}
.chart{width:100%;display:block;overflow:visible}
.axis{font-size:11px;fill:var(--text-3)}
.axis-strong{font-size:11.5px;fill:var(--text-2)}
.gridline{stroke:var(--line);stroke-width:1}
.dlabel{font-size:11px;font-weight:650;fill:var(--text-2);font-variant-numeric:tabular-nums}
.mark{transition:opacity .12s}
.chartwrap:hover .mark{opacity:.45}
.chartwrap .mark:hover{opacity:1}
.scroll-x{overflow-x:auto}

/* Tooltip */
#tip{position:fixed;z-index:100;pointer-events:none;background:var(--surface-1);color:var(--text-1);
  border:1px solid var(--line-strong);border-radius:8px;padding:8px 11px;font-size:12.5px;
  box-shadow:0 6px 20px rgba(16,24,40,.16);max-width:330px;opacity:0;transition:opacity .1s;line-height:1.45}
#tip.on{opacity:1}
#tip .tt{font-weight:650;margin-bottom:3px}
#tip .tr{display:flex;justify-content:space-between;gap:16px;font-variant-numeric:tabular-nums}
#tip .tr i{width:9px;height:9px;border-radius:2px;display:inline-block;margin-right:6px}
#tip .tm{color:var(--text-3);font-size:11.5px}

/* Tabla */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface-1)}
table{border-collapse:collapse;width:100%;font-size:13px}
thead th{background:var(--surface-2);text-align:left;padding:9px 11px;font-size:11px;text-transform:uppercase;
  letter-spacing:.05em;color:var(--text-3);font-weight:650;border-bottom:1px solid var(--line);
  position:sticky;top:0;white-space:nowrap;cursor:pointer;user-select:none}
thead th:hover{color:var(--brand)}
tbody td{padding:8px 11px;border-bottom:1px solid var(--line);vertical-align:top}
tbody tr:hover{background:var(--surface-2)}
tbody tr.anul td{opacity:.5}
td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td.cod{font-family:ui-monospace,Consolas,monospace;font-size:11.5px;white-space:nowrap;color:var(--text-2)}
td.tit{min-width:320px;max-width:520px}
.pill{display:inline-block;border-radius:5px;padding:1.5px 7px;font-size:11px;font-weight:600;white-space:nowrap}
.pill.f{background:var(--good-bg);color:var(--good)}
.pill.nf{background:var(--surface-0);color:var(--text-3)}
.pill.an{background:var(--crit-bg);color:var(--crit)}
.pager{display:flex;gap:8px;align-items:center;justify-content:center;padding:12px;font-size:13px;color:var(--text-2)}
.pager button{background:var(--surface-1);border:1px solid var(--line-strong);border-radius:7px;padding:5px 11px;cursor:pointer}
.pager button:disabled{opacity:.4;cursor:default}

/* Avisos */
.alert{background:var(--surface-1);border:1px solid var(--line);border-left-width:4px;border-radius:var(--radius);
  margin-bottom:11px;box-shadow:var(--shadow);overflow:hidden}
.alert.crit{border-left-color:var(--crit)} .alert.serious{border-left-color:var(--serious)}
.alert.warn{border-left-color:var(--warn)} .alert.info{border-left-color:var(--brand)}
.alert.good{border-left-color:var(--good)}
.alert > summary{padding:12px 16px;cursor:pointer;display:flex;align-items:flex-start;gap:11px;list-style:none}
.alert > summary::-webkit-details-marker{display:none}
.alert > summary::after{content:"\203A";margin-left:10px;color:var(--text-3);font-size:19px;transition:transform .15s;line-height:1}
.alert[open] > summary::after{transform:rotate(90deg)}
.alert .ico{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;font-size:12px;font-weight:800;flex:0 0 auto}
.alert.crit .ico{background:var(--crit-bg);color:var(--crit)} .alert.serious .ico{background:var(--serious-bg);color:var(--serious)}
.alert.warn .ico{background:var(--warn-bg);color:var(--warn)} .alert.info .ico{background:var(--info-bg);color:var(--brand)}
.alert.good .ico{background:var(--good-bg);color:var(--good)}
.alert .ttl{font-weight:620;font-size:13.5px;display:block}
.alert .dsc{font-size:12px;color:var(--text-2);margin-top:2px;display:block}
.alert .n{font-variant-numeric:tabular-nums;font-weight:700;font-size:13px;background:var(--surface-0);
  border-radius:6px;padding:2px 9px;color:var(--text-2);flex:0 0 auto;margin-left:auto;margin-top:1px}
.alert .body{padding:12px 16px 14px;border-top:1px solid var(--line)}
.alert ul{margin:0;padding-left:18px}
.alert li{margin-bottom:5px;font-size:12.5px;color:var(--text-2)}
.alert li b{color:var(--text-1);font-weight:600}
.alert .more{font-size:12px;color:var(--text-3);margin-top:8px;font-style:italic}
.alert .act{margin-top:11px}

/* Varios */
.note{background:var(--surface-2);border:1px dashed var(--line-strong);border-radius:var(--radius);
  padding:13px 16px;font-size:12.5px;color:var(--text-2);margin-bottom:16px}
.note b{color:var(--text-1)}
.empty{text-align:center;padding:52px 20px;color:var(--text-3);font-size:13.5px}
.sec{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--text-3);font-weight:650;
  margin:22px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.sec:first-child{margin-top:0}
#drop{position:fixed;inset:0;background:rgba(11,42,138,.9);color:#fff;display:none;place-items:center;
  z-index:200;font-size:19px;text-align:center;padding:40px}
#drop.on{display:grid}
#drop .box{border:3px dashed var(--accent);border-radius:16px;padding:52px 68px}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(90px);z-index:150;
  background:var(--text-1);color:var(--surface-1);padding:11px 20px;border-radius:9px;font-size:13.5px;
  box-shadow:0 8px 26px rgba(0,0,0,.28);transition:transform .22s;max-width:80vw}
#toast.on{transform:translateX(-50%) translateY(0)}
@media (max-width:820px){
  .top,.filters,.tabs,main{padding-left:14px;padding-right:14px}
  .c2{grid-template-columns:1fr}
  .fg input,.fg select{min-width:0;width:100%}
}
@media print{
  .tabs,.filters,.top .tbtn,#tip{display:none!important}
  .card{break-inside:avoid;box-shadow:none}
  body{background:#fff}
}
</style>
</head>
<body>
<div id="tip"></div>
<div id="drop"><div class="box">Suelta aqu&iacute; el libro <b>Control_Eventos</b> (.xlsm / .xlsx)</div></div>
<div id="toast"></div>

<header class="top">
  <div class="mark">A</div>
  <div>
    <h1>Control de Eventos &middot; Palacio de Ferias y Congresos de Marbella</h1>
    <div class="sub">Cuadro de mando, an&aacute;lisis y avisos &mdash; AMMA Consulting</div>
  </div>
  <div class="spacer"></div>
  <div class="stamp" id="stamp"></div>
  <button class="tbtn primary" id="btnLoad">Actualizar desde Excel</button>
  <button class="tbtn" id="btnExport">Exportar</button>
  <button class="tbtn" id="btnTheme" title="Cambiar tema">Tema</button>
  <input type="file" id="fileIn" accept=".xlsm,.xlsx,.xls" hidden>
</header>

<nav class="tabs" role="tablist">
  <button class="tab" role="tab" data-p="panel" aria-selected="true">Panel</button>
  <button class="tab" role="tab" data-p="avisos" aria-selected="false">Avisos <span class="badge" id="nAlerts">0</span></button>
  <button class="tab" role="tab" data-p="analisis" aria-selected="false">An&aacute;lisis</button>
  <button class="tab" role="tab" data-p="cartera" aria-selected="false">Cartera futura <span class="badge mut" id="nCart">0</span></button>
  <button class="tab" role="tab" data-p="eventos" aria-selected="false">Eventos</button>
</nav>

<div class="filters">
  <div class="fg"><label for="fAno">A&ntilde;o</label><select id="fAno"></select></div>
  <div class="fg"><label for="fGrupo">Tipolog&iacute;a</label><select id="fGrupo"></select></div>
  <div class="fg"><label for="fCar">Car&aacute;cter</label><select id="fCar"></select></div>
  <div class="fg"><label for="fDel">Delegaci&oacute;n</label><select id="fDel"></select></div>
  <div class="fg"><label for="fFact">Facturable</label><select id="fFact"></select></div>
  <div class="fg"><label for="fQ">Buscar</label><input id="fQ" type="search" placeholder="t&iacute;tulo, c&oacute;digo, tipo..."></div>
  <label class="chk"><input type="checkbox" id="fAnul"> Incluir anulados</label>
  <button class="fbtn" id="btnReset">Limpiar</button>
  <div class="fcount" id="fcount"></div>
</div>

<main>
  <section class="panel" id="p-panel"></section>
  <section class="panel" id="p-avisos" hidden></section>
  <section class="panel" id="p-analisis" hidden></section>
  <section class="panel" id="p-cartera" hidden></section>
  <section class="panel" id="p-eventos" hidden></section>
</main>

<script>
